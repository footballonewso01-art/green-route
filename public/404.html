<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Page Not Found | Linktery</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #050807; color: #f8fafc; }
    main { width: min(92vw, 560px); padding: 48px; text-align: center; border: 1px solid #1f2a25; border-radius: 24px; background: #0a100d; box-shadow: 0 32px 90px rgba(0,0,0,.45); }
    strong { display: block; color: #34d399; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 16px 0 12px; font-size: clamp(40px, 9vw, 72px); line-height: 1; }
    p { margin: 0 auto 28px; color: #94a3b8; line-height: 1.6; }
    a { display: inline-flex; padding: 12px 18px; border-radius: 12px; background: #34d399; color: #04100a; font-weight: 800; text-decoration: none; }
    a:focus-visible { outline: 3px solid #a7f3d0; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <strong>Linktery</strong>
    <h1>404</h1>
    <p>The page you requested does not exist or has moved.</p>
    <a href="/">Return to homepage</a>
  </main>
</body>
</html>
