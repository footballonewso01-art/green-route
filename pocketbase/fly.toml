# fly.toml app configuration file generated for greenroute-pb on 2026-03-11T18:09:34+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'greenroute-pb'
primary_region = 'fra'

[[mounts]]
  source = 'pb_data'
  destination = '/pb/pb_data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = '30s'
  interval = '15s'
  method = 'GET'
  timeout = '5s'
  path = '/api/health'

[http_service.checks.headers]
  X-Forwarded-Proto = 'https'

[[vm]]
  memory = '4gb'
  cpus = 2
  memory_mb = 4096
