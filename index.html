<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/src/components/AppLoadingScreen.css" />
  <!-- Critical for prerendered marketing markup: prevents an unstyled Hero image flash before hydration. -->
  <link rel="stylesheet" href="/src/styles/landing-rebrand.css" />
  <script>
    try {
      if (localStorage.getItem("pocketbase_auth")) {
        document.documentElement.dataset.authSnapshot = "present";
      }
    } catch (_) {}
  </script>
  <style id="auth-snapshot-critical">
    html[data-auth-snapshot="present"] [data-auth-visibility="guest"] { visibility: hidden !important; }
  </style>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
  <title>Linktery — Link In Bio &amp; Analytics</title>
  <meta name="description" content="Linktery - Smart Link Management and Traffic Routing" />
  <meta name="author" content="Linktery" />
  <link rel="canonical" href="https://linktery.com" />
  <!-- The SPA shell is never indexable. Prerender replaces this value on SEO pages. -->
  <meta name="robots" content="noindex, nofollow" />

  <meta property="og:site_name" content="Linktery" />
  <meta property="og:title" content="Linktery — Link in Bio & Traffic Analytics Platform" />
  <meta property="og:description" content="Design premium link-in-bio profiles, route traffic intelligently, and understand every click." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://linktery.com" />
  <meta property="og:image" content="https://linktery.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Linktery smart links and analytics" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@Linktery" />
  <meta name="twitter:title" content="Linktery — Link in Bio & Traffic Analytics Platform" />
  <meta name="twitter:description" content="Design premium link-in-bio profiles, route traffic intelligently, and understand every click." />
  <meta name="twitter:image" content="https://linktery.com/og-image.png" />
  <meta name="twitter:image:alt" content="Linktery smart links and analytics" />

  <!-- Performance preconnections and font preloading -->
  <link rel="preconnect" href="%VITE_POCKETBASE_URL%" />
  <link rel="dns-prefetch" href="%VITE_POCKETBASE_URL%" />



  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "@id": "https://linktery.com/#organization",
    "name": "Linktery",
    "url": "https://linktery.com",
    "logo": "https://linktery.com/linktery-logo.png"
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "@id": "https://linktery.com/#website",
    "name": "Linktery",
    "url": "https://linktery.com",
    "publisher": { "@id": "https://linktery.com/#organization" }
  }
  </script>
</head>

<body>
  <!--app-root-start--><div id="root">
    <div class="app-loading-screen" role="status" aria-live="polite" aria-atomic="true">
      <span class="app-loading-screen__spinner" aria-hidden="true"></span>
      <p class="app-loading-screen__label">Loading…</p>
    </div>
  </div><!--app-root-end-->
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
